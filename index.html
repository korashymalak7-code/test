                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="mb-1"></span>
                        <span class="mb-1"></span>
                        <span></span>
                    </button>
                </div>
                <div class="parentUl p-1  navbar-collapse justify-content-center  mt-3 mt-md-0"

                    <ul class="navbar-nav">

                        </li>
                        <li class="nav-item">

                        </li>
                        <li class="nav-item">

                        </li>
                        <li class="nav-item d-none">

                        </li>
                        <div class="after"></div>
                    </ul>
                </div>

            </div>

        <section id="Home" class="w-100 vh-100 ">
            <div id="carouselExampleFade" class="carousel slide carousel-fade h-100" data-bs-ride="carousel">
                <div class="carousel-inner h-100">
                    <div class="carousel-item h-100 active">
                        <img src="./images/up_back.jpg" class="d-block w-100 h-100" alt="img">
                    </div>

                    <div class="carousel-item h-100">
                        <img src="./images/brave_back.jpg" class="d-block w-100 h-100" alt="img">
                    </div>

                    <div class="carousel-item h-100">
                        <img src="./images/car_back.jpg" class="d-block  w-100 h-100" alt="img">
                    </div>

                    <div class="carousel-item h-100">
                        <img src="./images/badGuys2_back.jpg" class="d-block  w-100 h-100" alt="img">
                    </div>

                    <div class="carousel-item h-100">
                        <img src="./images/zootopia2_back.jpg" class="d-block  w-100 h-100" alt="img">
                    </div>
                </div>
            </div>
        </section>

        <div class="sideBar table-responsive pt-md-5 ps-md-3 p-2 ">
            <i class="fa-solid fa-circle-xmark close"></i>

                <ul class="list-unstyled mb-0">

                    </li>
                </ul>
            </div>
        </div>

    <section id="Trending" class="pt-5">

            <span></span>
        </div>

            <!-- add elements by js  -->
        </div>

            <!-- add elements by js  -->
        </div>

    <section id="Movies" class="py-5">
        <div class="title mb-5">

        <div class="container">
            <div class="head mb-5 table-responsive">

                    <li>
                        <p class="mb-0" onclick="getData('AllMovies',allMovies)">All Movies</p>
                    </li>
                    <li>
                        <p class="mb-0" onclick="getData('AllMovies',allMovies,'Comedy')">Comedy</p>

                    <li>

            <i class="fa-solid fa-xmark" onclick="closePopup()"></i>

                <button class="theme">Change Theme</button>

        </div>
