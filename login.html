<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="./css/bootstrap.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <section id="Login" class="w-100 vh-100">
        <div class="box text-center py-5">
            <div class="body text-center">
                <div class="container">
                    <form class="registration">
                        <h2 class="mb-3">REGISTRATION</h2>
                        <div class="group mb-5">
                            <input class=" mb-3 w-100 form-control" type="text" name="name" placeholder="User Name">
                            <input class="mb-3 w-100 form-control" type="text" name="email" placeholder="Email">
                            <input class="w-100 form-control" type="password" name="password" placeholder="Password">
                        <!-- <div class="passwordCont">
                             
                            <div class="strength" data-bs-strength>
                            <div class="strength-segment"></div>
                            <div class="strength-segment"></div>
                            <div class="strength-segment"></div>
                            <div class="strength-segment"></div>
                        </div>
                        <span class="strength-text"></span>  -->

                        </div>

                        <a class="m-auto login addAccount"><span class="text">Create account</span></a>
                    </form>
                </div>
                <div class="container mt-5 mt-xl-0">
                    <form class="login">
                        <h2 class="mb-3">Login</h2>
                        <div class="group mb-4">
                            <input class=" mb-3 w-100 form-control" type="text" name="name" placeholder="User Name">
                            <input class="w-100 form-control" type="text" name="email" placeholder="Email">
                        </div>
                        <div class="content mb-5">
                            <div class="check">
                                <input type="checkbox" id="Remember">
                                <label for="Remember">Remember me</label>
                            </div>
                            <p class="mb-0">Forget Password?</p>
                        </div>
                        <a class="m-auto  createAccount" href="./index.html"><span class="text">login</span></a>
                    </form>
                </div>
            </div>
            <div class="slide">
                <div class="slide-left m-auto">
                    <div class="container">
                        <h2>Hello, Welcome!</h2>
                        <p>Don't have an account ?</p>
                        <button class=" registerButton"> Register </button>
                    </div>
                </div>
                <div class="slide-right m-auto">
                    <div class="container">
                        <h2>Welcome Back!</h2>
                        <p> Already have an account </p>
                        <button class="loginButton"> Login </button>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="./js/bootstrap.js"></script>
    <script src="./js/jQuery.js"></script>
    <script src="./js/functions.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/login.js"></script>
     
</body>

</html>
